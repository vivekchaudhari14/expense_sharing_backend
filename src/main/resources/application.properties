spring.application.name=expense_sharing_backend

# -------------------------------------------------------------
# Server Configuration
# -------------------------------------------------------------
server.port=8080
server.servlet.context-path=/

# -------------------------------------------------------------
# PostgreSQL Database Connection
# -------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/splitwise_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------
# HikariCP Connection Pool Settings
# -------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=SplitwiseHikariCP

# -------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------
# 'update' auto-creates/alters tables on start (use 'validate' in production)
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL in console (useful during development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Postgres dialect configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------
logging.level.root=INFO
logging.level.com.splitwise=DEBUG
# Uncomment below if you want to inspect SQL parameter values:
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

